[core]
plugins = animate autostart command gtkdecor foreign-toplevel ext-toplevel grid gtk-shell ipc ipc-rules move place resize session-lock switcher vswitch window-rules wm-actions wsets xdg-activation
vwidth = 5
vheight = 1
background_color = 0.078 0.094 0.129 1.000
preferred_decoration_mode = server
close_top_view = <super> KEY_Q | <alt> KEY_F4
xwayland = true

[input]
xkb_layout = @XKB_LAYOUT@
xkb_options = @XKB_OPTIONS@
mouse_cursor_speed = @MOUSE_CURSOR_SPEED@
touchpad_cursor_speed = @TOUCHPAD_CURSOR_SPEED@
natural_scroll = @NATURAL_SCROLL@
tap_to_click = @TAP_TO_CLICK@
disable_touchpad_while_typing = @DISABLE_TOUCHPAD_WHILE_TYPING@

[animate]
open_animation = fade
close_animation = fade
minimize_animation = squeezimize
enabled_for = (type equals "toplevel" | (type equals "x-or" & focusable equals true))
duration = 220ms circle
zoom_duration = 220ms circle
fade_duration = 180ms linear
squeezimize_duration = 200ms circle
startup_duration = 200ms linear

[gtkdecor]
font = Onest
font_color = #edf0f5ff
title_height = 36
border_size = 1
button_order = minimize maximize close
button_style = plume
forced_views = none
active_color = #171a21ff
inactive_color = #13161cff

[place]
mode = center

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[grid]
duration = 220ms circle
type = crossfade
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_c = <super> KEY_UP
restore = <super> KEY_DOWN

[vswitch]
gap = 0
binding_left = <ctrl> <super> KEY_LEFT
binding_right = <ctrl> <super> KEY_RIGHT

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB

[wm-actions]
toggle_maximize = <super> KEY_M
minimize = <super> KEY_H

[autostart]
autostart_wf_shell = false
plume = @AUTOSTART@

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = kitty

binding_files = <super> KEY_E
command_files = thunar

binding_launcher = <super> KEY_D
command_launcher = plume-launcher

binding_settings = <super> KEY_I
command_settings = plume-settings

binding_lock = <super> KEY_L
command_lock = plume-lock

binding_shot_full = KEY_SYSRQ
command_shot_full = plume-screenshot full

binding_shot_area = <shift> KEY_SYSRQ
command_shot_area = plume-screenshot area

repeatable_binding_vol_up = KEY_VOLUMEUP
command_vol_up = pactl set-sink-volume @DEFAULT_SINK@ +5%

repeatable_binding_vol_down = KEY_VOLUMEDOWN
command_vol_down = pactl set-sink-volume @DEFAULT_SINK@ -5%

binding_vol_mute = KEY_MUTE
command_vol_mute = pactl set-sink-mute @DEFAULT_SINK@ toggle

repeatable_binding_bright_up = KEY_BRIGHTNESSUP
command_bright_up = brightnessctl set +5%

repeatable_binding_bright_down = KEY_BRIGHTNESSDOWN
command_bright_down = brightnessctl set 5%-
